[package]
name = "auto-translate-subs"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.30", features = ["default", "accesskit"] }
egui = "0.30"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rfd = "0.15"
walkdir = "2.5"
chrono = "0.4"
dirs = "5.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "wav"] }
